# Reactive thread (model1): thinking OFF.
# Same served model as planning -- one vLLM server, one copy in VRAM.
# Thinking MUST be off here: a budget-forced reasoning model scores 0.0000
# in the paper (Table 7) because truncation yields no parseable \boxed{}.
model: Qwen/Qwen3-8B
url: http://127.0.0.1:8000/v1
api_key: dummy
inference_parameters:
  temperature: 0.7
  top_p: 0.8
  # Headroom only. reactive_inference uses min(internal_budget, max_tokens), so a
  # value here BELOW internal_budget silently caps the agent: with 2048 set here,
  # IBUDGET=4096 runs actually generated at most 2048 tokens.
  max_tokens: 16384
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
# no tokenizer key: config_model1 never reads one
